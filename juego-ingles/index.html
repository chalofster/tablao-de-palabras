<!doctype html>
<html lang="es">
  <head>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tablao" />
    <link rel="apple-touch-icon" href="./icono-180.png" />
